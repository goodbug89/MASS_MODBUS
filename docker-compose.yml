services:
  # Modbus 시뮬레이터 (4대의 가상 CIE-H14A 장비)
  modbus-simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: modbus-simulator
    restart: unless-stopped
    ports:
      - "5020:5020"
      - "5021:5021"
      - "5022:5022"
      - "5023:5023"
    networks:
      - modbus-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 5020)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Flask 애플리케이션
  modbus-controller:
    build: .
    container_name: modbus-controller-multi
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - TZ=Asia/Seoul
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # 전역 Modbus 기본값 (개별 장비 설정이 없을 때 사용)
      - MODBUS_DEFAULT_UNIT_ID=${MODBUS_DEFAULT_UNIT_ID:-1}
      - MODBUS_DEFAULT_TIMEOUT=${MODBUS_DEFAULT_TIMEOUT:-0.3}
      - MODBUS_DEFAULT_POLL_INTERVAL=${MODBUS_DEFAULT_POLL_INTERVAL:-0.5}
      - MODBUS_DEFAULT_AUTO_OFF_TIME=${MODBUS_DEFAULT_AUTO_OFF_TIME:-1.0}
      - MODBUS_DEFAULT_RETRY_COUNT=${MODBUS_DEFAULT_RETRY_COUNT:-3}
      - MODBUS_DEFAULT_RETRY_DELAY=${MODBUS_DEFAULT_RETRY_DELAY:-0.1}

      # 센서 URL (공통)
      - SENSOR_URL=${SENSOR_URL:-http://localhost:5000/api/get_sensor}

      # 장비 1-4 설정 (.env 파일에서 로드)
      # DEVICE1_ENABLED, DEVICE1_NAME, DEVICE1_HOST 등은 .env 파일에서 자동 로드됨

    env_file:
      - .env
    depends_on:
      modbus-simulator:
        condition: service_healthy
    networks:
      - modbus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'      # 멀티 디바이스를 위해 CPU 증가
          memory: 1G        # 멀티 디바이스를 위해 메모리 증가
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  modbus-network:
    driver: bridge
