<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UWB 이륜차 하이패스 모니터링</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --bg-dark: #0a0e1a;
            --bg-card: #1a1f2e;
            --border-color: #2d3748;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --glow-green: rgba(16, 185, 129, 0.5);
            --glow-red: rgba(239, 68, 68, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* 네비게이션 */
        .navbar-custom {
            background: rgba(26, 31, 46, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--border-color);
            padding: 1rem 2rem;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary) !important;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container {
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 32px;
            object-fit: contain;
        }

        /* 상태 배지 */
        .status-badge {
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge.connected {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            border: 2px solid var(--accent-green);
        }

        .status-badge.disconnected {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border: 2px solid var(--accent-red);
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-indicator.active {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--glow-green);
        }

        .status-indicator.inactive {
            background: var(--accent-red);
            box-shadow: 0 0 10px var(--glow-red);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 메인 컨테이너 */
        .main-container {
            padding: 1.5rem;
            max-width: 100%;
            margin: 0 auto;
        }

        /* Lane 그리드 */
        .lanes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        /* Lane 카드 */
        .lane-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            height: fit-content;
        }

        .lane-card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2);
        }

        .lane-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-color);
        }

        .lane-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 레이저 센서 시각화 */
        .sensor-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin: 1rem 0;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            position: relative;
        }

        .sensor {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .sensor-beam {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .sensor-beam.active {
            border-color: var(--accent-red);
            background: radial-gradient(circle, rgba(239, 68, 68, 0.3), transparent);
            box-shadow: 0 0 30px var(--glow-red), inset 0 0 20px var(--glow-red);
            animation: sensorPulse 1s infinite;
        }

        @keyframes sensorPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .sensor-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        /* 차량 애니메이션 */
        .vehicle-lane {
            flex: 1;
            height: 70px;
            background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lane-markers {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: repeating-linear-gradient(
                90deg,
                #fff 0px,
                #fff 20px,
                transparent 20px,
                transparent 40px
            );
            opacity: 0.3;
        }

        .vehicle {
            position: absolute;
            width: 50px;
            height: 35px;
            background: var(--accent-blue);
            border-radius: 8px 8px 4px 4px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.5);
        }

        .vehicle.entering {
            display: flex;
            animation: vehicleEnter 2s ease-in-out;
        }

        .vehicle.exiting {
            display: flex;
            animation: vehicleExit 2s ease-in-out;
        }

        @keyframes vehicleEnter {
            0% { left: -70px; }
            100% { left: calc(100% + 10px); }
        }

        @keyframes vehicleExit {
            0% { right: -70px; }
            100% { right: calc(100% + 10px); }
        }

        .direction-arrow {
            position: absolute;
            font-size: 1.8rem;
            color: var(--accent-green);
            animation: arrowBounce 1.5s infinite;
            display: none;
        }

        .direction-arrow.entering {
            display: block;
            left: 20px;
        }

        .direction-arrow.exiting {
            display: block;
            right: 20px;
        }

        @keyframes arrowBounce {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }

        /* 신호등 */
        .traffic-lights {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .traffic-light {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 2px solid var(--border-color);
        }

        .traffic-light-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .lights-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            background: #1a1a1a;
            border-radius: 12px;
            border: 3px solid #333;
        }

        .light {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 3px solid #333;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .light.green {
            background: #1a3a1a;
        }

        .light.green.on {
            background: var(--accent-green);
            box-shadow: 0 0 30px var(--glow-green), inset 0 0 20px rgba(255, 255, 255, 0.3);
            animation: glow 1.5s infinite;
        }

        .light.red {
            background: #3a1a1a;
        }

        .light.red.on {
            background: var(--accent-red);
            box-shadow: 0 0 30px var(--glow-red), inset 0 0 20px rgba(255, 255, 255, 0.3);
            animation: glow 1.5s infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        /* 상태 정보 */
        .status-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .status-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            text-align: center;
        }

        .status-item-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .status-item-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .status-item-value.positive {
            color: var(--accent-green);
        }

        /* 이벤트 로그 */
        .event-log {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-top: 1.5rem;
        }

        .event-log-header {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .event-list {
            max-height: 250px;
            overflow-y: auto;
        }

        .event-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent-blue);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .event-item:hover {
            background: rgba(59, 130, 246, 0.1);
            transform: translateX(5px);
        }

        .event-item.enter {
            border-left-color: var(--accent-green);
        }

        .event-item.exit {
            border-left-color: var(--accent-orange);
        }

        .event-content {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .event-icon {
            font-size: 1.2rem;
        }

        .event-details {
            flex: 1;
        }

        .event-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }

        .event-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* 스크롤바 스타일 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }

        /* 반응형 */
        @media (max-width: 1024px) {
            .lanes-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }

            .lane-card {
                padding: 1rem;
            }

            .sensor-visual {
                flex-direction: column;
                gap: 1rem;
            }

            .traffic-lights {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 네비게이션 -->
    <nav class="navbar-custom">
        <div class="container-fluid">
            <div class="navbar-brand">
                <div class="logo-container">
                    <img src="https://www.kyungwoo.co.kr/images/common/logo.png" alt="Kyungwoo Logo" class="logo-img" onerror="this.style.display='none'">
                </div>
                <i class="bi bi-broadcast"></i>
                UWB 이륜차 하이패스 모니터링
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="/" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-house-door"></i> 메인 대시보드
                </a>
                <span id="connectionStatus" class="status-badge disconnected">
                    <span class="status-indicator inactive"></span>
                    <span id="connectionText">연결 중...</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <!-- Lane 그리드 -->
        <div class="lanes-grid">
            <!-- Lane 1 -->
            <div class="lane-card">
            <div class="lane-header">
                <div class="lane-title">
                    <i class="bi bi-1-circle-fill"></i>
                    Lane 1
                </div>
                <div class="status-badge" id="lane1Status">
                    <span class="status-indicator"></span>
                    <span>대기</span>
                </div>
            </div>

            <!-- 레이저 센서 시각화 -->
            <div class="sensor-visual">
                <div class="sensor">
                    <div class="sensor-beam" id="lane1_di0">
                        <i class="bi bi-lightning-fill"></i>
                    </div>
                    <div class="sensor-label">레이저 센서 1 (DI0)</div>
                </div>

                <div class="vehicle-lane">
                    <div class="lane-markers"></div>
                    <div class="vehicle" id="lane1_vehicle">
                        <i class="bi bi-bicycle" style="font-size: 1.5rem; color: white;"></i>
                    </div>
                    <div class="direction-arrow" id="lane1_arrow_enter">
                        <i class="bi bi-arrow-right"></i>
                    </div>
                    <div class="direction-arrow" id="lane1_arrow_exit">
                        <i class="bi bi-arrow-left"></i>
                    </div>
                </div>

                <div class="sensor">
                    <div class="sensor-beam" id="lane1_di1">
                        <i class="bi bi-lightning-fill"></i>
                    </div>
                    <div class="sensor-label">레이저 센서 2 (DI1)</div>
                </div>
            </div>

            <!-- 신호등 -->
            <div class="traffic-lights">
                <div class="traffic-light">
                    <div class="traffic-light-label">DO0 - 초록 신호</div>
                    <div class="lights-container">
                        <div class="light green" id="lane1_green" onclick="toggleOutput('device1', 0)"></div>
                    </div>
                </div>
                <div class="traffic-light">
                    <div class="traffic-light-label">DO1 - 빨강 신호</div>
                    <div class="lights-container">
                        <div class="light red" id="lane1_red" onclick="toggleOutput('device1', 1)"></div>
                    </div>
                </div>
            </div>

            <!-- 상태 정보 -->
            <div class="status-info">
                <div class="status-item">
                    <div class="status-item-label">현재 상태</div>
                    <div class="status-item-value" id="lane1_current_state">대기중</div>
                </div>
                <div class="status-item">
                    <div class="status-item-label">총 입차</div>
                    <div class="status-item-value positive" id="lane1_enter_count">0</div>
                </div>
                <div class="status-item">
                    <div class="status-item-label">총 출차</div>
                    <div class="status-item-value" id="lane1_exit_count">0</div>
                </div>
                <div class="status-item">
                    <div class="status-item-label">마지막 이벤트</div>
                    <div class="status-item-value" style="font-size: 0.95rem;" id="lane1_last_event">-</div>
                </div>
            </div>
        </div>

        <!-- Lane 2 -->
        <div class="lane-card">
            <div class="lane-header">
                <div class="lane-title">
                    <i class="bi bi-2-circle-fill"></i>
                    Lane 2
                </div>
                <div class="status-badge" id="lane2Status">
                    <span class="status-indicator"></span>
                    <span>대기</span>
                </div>
            </div>

            <!-- 레이저 센서 시각화 -->
            <div class="sensor-visual">
                <div class="sensor">
                    <div class="sensor-beam" id="lane2_di2">
                        <i class="bi bi-lightning-fill"></i>
                    </div>
                    <div class="sensor-label">레이저 센서 1 (DI2)</div>
                </div>

                <div class="vehicle-lane">
                    <div class="lane-markers"></div>
                    <div class="vehicle" id="lane2_vehicle">
                        <i class="bi bi-bicycle" style="font-size: 1.5rem; color: white;"></i>
                    </div>
                    <div class="direction-arrow" id="lane2_arrow_enter">
                        <i class="bi bi-arrow-right"></i>
                    </div>
                    <div class="direction-arrow" id="lane2_arrow_exit">
                        <i class="bi bi-arrow-left"></i>
                    </div>
                </div>

                <div class="sensor">
                    <div class="sensor-beam" id="lane2_di3">
                        <i class="bi bi-lightning-fill"></i>
                    </div>
                    <div class="sensor-label">레이저 센서 2 (DI3)</div>
                </div>
            </div>

            <!-- 신호등 -->
            <div class="traffic-lights">
                <div class="traffic-light">
                    <div class="traffic-light-label">DO2 - 초록 신호</div>
                    <div class="lights-container">
                        <div class="light green" id="lane2_green" onclick="toggleOutput('device1', 2)"></div>
                    </div>
                </div>
                <div class="traffic-light">
                    <div class="traffic-light-label">DO3 - 빨강 신호</div>
                    <div class="lights-container">
                        <div class="light red" id="lane2_red" onclick="toggleOutput('device1', 3)"></div>
                    </div>
                </div>
            </div>

            <!-- 상태 정보 -->
            <div class="status-info">
                <div class="status-item">
                    <div class="status-item-label">현재 상태</div>
                    <div class="status-item-value" id="lane2_current_state">대기중</div>
                </div>
                <div class="status-item">
                    <div class="status-item-label">총 입차</div>
                    <div class="status-item-value positive" id="lane2_enter_count">0</div>
                </div>
                <div class="status-item">
                    <div class="status-item-label">총 출차</div>
                    <div class="status-item-value" id="lane2_exit_count">0</div>
                </div>
                <div class="status-item">
                    <div class="status-item-label">마지막 이벤트</div>
                    <div class="status-item-value" style="font-size: 0.95rem;" id="lane2_last_event">-</div>
                </div>
            </div>
        </div>
        </div>

        <!-- 이벤트 로그 -->
        <div class="event-log">
            <div class="event-log-header">
                <i class="bi bi-clock-history"></i>
                이벤트 로그
            </div>
            <div class="event-list" id="eventList">
                <div style="text-align: center; color: var(--text-secondary); padding: 2rem;">
                    이벤트가 없습니다
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/hipass.js"></script>
</body>
</html>
