<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIE-H14A Modbus 멀티 제어</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 네비게이션 바 -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <div class="logo-container">
                    <img src="https://www.kyungwoo.co.kr/images/common/logo.png" alt="Kyungwoo Logo" class="logo-img" onerror="this.style.display='none'">
                </div>
                <i class="bi bi-cpu"></i> CIE-H14A Modbus 멀티 제어 시스템
            </span>
            <div class="d-flex align-items-center">
                <a href="/hipass" class="btn btn-outline-success btn-sm me-2">
                    <i class="bi bi-broadcast"></i> UWB 하이패스
                </a>
                <a href="/docs" class="btn btn-outline-light btn-sm me-2">
                    <i class="bi bi-book"></i> API 문서
                </a>
                <span id="connectionStatus" class="badge bg-secondary">
                    <i class="bi bi-circle-fill status-indicator"></i>
                    <span id="connectionText">연결 중...</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- 알림 영역 -->
        <div id="alertContainer"></div>

        <!-- 시뮬레이터 제어 카드 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card border-info">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-gear-fill"></i> Modbus 시뮬레이터 제어
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-4 mb-2 mb-md-0">
                                <div class="d-flex align-items-center">
                                    <span class="me-3"><strong>상태:</strong></span>
                                    <span id="simulatorStatus" class="badge bg-secondary">
                                        <i class="bi bi-circle-fill"></i>
                                        <span id="simulatorStatusText">확인 중...</span>
                                    </span>
                                </div>
                            </div>
                            <div class="col-md-8">
                                <div class="btn-group" role="group">
                                    <button type="button" class="btn btn-success btn-sm" id="btnSimulatorStart">
                                        <i class="bi bi-play-fill"></i> 시작
                                    </button>
                                    <button type="button" class="btn btn-warning btn-sm" id="btnSimulatorStop">
                                        <i class="bi bi-stop-fill"></i> 중지
                                    </button>
                                    <button type="button" class="btn btn-primary btn-sm" id="btnSimulatorRestart">
                                        <i class="bi bi-arrow-clockwise"></i> 재시작
                                    </button>
                                    <button type="button" class="btn btn-info btn-sm" id="btnSimulatorRefresh">
                                        <i class="bi bi-arrow-repeat"></i> 상태 새로고침
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div id="simulatorMessage" class="mt-3" style="display: none;">
                            <div class="alert alert-info mb-0" role="alert">
                                <i class="bi bi-info-circle"></i>
                                <span id="simulatorMessageText"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- API 모니터링 카드 (전체 통합) -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-activity"></i> API 모니터링 (전체 시스템)
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-6 col-md-2 mb-3">
                                <small class="text-muted">가동 시간</small>
                                <div class="fs-5 fw-bold text-primary" id="monitorUptime">-</div>
                            </div>
                            <div class="col-6 col-md-2 mb-3">
                                <small class="text-muted">활성 장비</small>
                                <div class="fs-5 fw-bold text-success" id="monitorActiveDevices">-</div>
                            </div>
                            <div class="col-6 col-md-2 mb-3">
                                <small class="text-muted">총 요청</small>
                                <div class="fs-5 fw-bold" id="monitorTotal">-</div>
                            </div>
                            <div class="col-6 col-md-2 mb-3">
                                <small class="text-muted">성공률</small>
                                <div class="fs-5 fw-bold text-success" id="monitorSuccess">-</div>
                            </div>
                            <div class="col-6 col-md-2 mb-3">
                                <small class="text-muted">1분 요청</small>
                                <div class="fs-5 fw-bold text-info" id="monitorRecent">-</div>
                            </div>
                            <div class="col-6 col-md-2 mb-3">
                                <small class="text-muted">평균 응답</small>
                                <div class="fs-5 fw-bold text-warning" id="monitorAvgTime">-</div>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-12">
                                <div class="progress" style="height: 8px;">
                                    <div id="monitorHealthBar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                                </div>
                                <small class="text-muted">마지막 체크: <span id="monitorLastCheck">-</span></small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 멀티 디바이스 그리드 레이아웃 -->
        <div class="row mb-4" id="devicesGrid">
            <!-- JavaScript에서 동적으로 생성됨 -->
        </div>

        <!-- 시스템 로그 (전체 통합) -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-journal-text"></i> 시스템 로그 (전체)
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="systemLog" class="system-log"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center py-3 mt-5">
        <div class="container">
            <small class="text-muted">
                CIE-H14A Modbus TCP/IP 멀티 제어 시스템 v2.0 |
                <i class="bi bi-github"></i> Made with Flask & Bootstrap
            </small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
