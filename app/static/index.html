<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIE-H14A Modbus 제어</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 네비게이션 바 -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <div class="logo-container">
                    <img src="https://www.kyungwoo.co.kr/images/common/logo.png" alt="Kyungwoo Logo" class="logo-img" onerror="this.style.display='none'">
                </div>
                <i class="bi bi-cpu"></i> CIE-H14A Modbus 제어 시스템
            </span>
            <div class="d-flex align-items-center">
                <a href="/docs" class="btn btn-outline-light btn-sm me-2">
                    <i class="bi bi-book"></i> API 문서
                </a>
                <span id="connectionStatus" class="badge bg-secondary">
                    <i class="bi bi-circle-fill status-indicator"></i>
                    연결 중...
                </span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 알림 영역 -->
        <div id="alertContainer"></div>

        <!-- API 모니터링 카드 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-activity"></i> API 모니터링
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-6 col-md-2 mb-3">
                                <small class="text-muted">가동 시간</small>
                                <div class="fs-5 fw-bold text-primary" id="monitorUptime">-</div>
                            </div>
                            <div class="col-6 col-md-2 mb-3">
                                <small class="text-muted">총 요청</small>
                                <div class="fs-5 fw-bold" id="monitorTotal">-</div>
                            </div>
                            <div class="col-6 col-md-2 mb-3">
                                <small class="text-muted">성공률</small>
                                <div class="fs-5 fw-bold text-success" id="monitorSuccess">-</div>
                            </div>
                            <div class="col-6 col-md-2 mb-3">
                                <small class="text-muted">1분 요청</small>
                                <div class="fs-5 fw-bold text-info" id="monitorRecent">-</div>
                            </div>
                            <div class="col-6 col-md-2 mb-3">
                                <small class="text-muted">평균 응답</small>
                                <div class="fs-5 fw-bold text-warning" id="monitorAvgTime">-</div>
                            </div>
                            <div class="col-6 col-md-2 mb-3">
                                <small class="text-muted">API 상태</small>
                                <div class="fs-5" id="monitorStatus">
                                    <i class="bi bi-circle-fill text-secondary"></i>
                                </div>
                            </div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-12">
                                <div class="progress" style="height: 8px;">
                                    <div id="monitorHealthBar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                                </div>
                                <small class="text-muted">마지막 체크: <span id="monitorLastCheck">-</span></small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 설정 정보 카드 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="bi bi-gear"></i> 연결 정보
                        </h5>
                        <div class="row">
                            <div class="col-md-3">
                                <small class="text-muted">호스트</small>
                                <div id="configHost">-</div>
                            </div>
                            <div class="col-md-3">
                                <small class="text-muted">포트</small>
                                <div id="configPort">-</div>
                            </div>
                            <div class="col-md-3">
                                <small class="text-muted">Unit ID</small>
                                <div id="configUnitId">-</div>
                            </div>
                            <div class="col-md-3">
                                <small class="text-muted">마지막 업데이트</small>
                                <div id="lastUpdate">-</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 디지털 입력 섹션 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-download"></i> 디지털 입력 (DI)
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-6 col-md-3 mb-3">
                                <div class="input-indicator" id="input0">
                                    <i class="bi bi-circle-fill led-off"></i>
                                    <div class="mt-2">
                                        <strong>DI 0</strong>
                                        <div class="input-state">OFF</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 col-md-3 mb-3">
                                <div class="input-indicator" id="input1">
                                    <i class="bi bi-circle-fill led-off"></i>
                                    <div class="mt-2">
                                        <strong>DI 1</strong>
                                        <div class="input-state">OFF</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 col-md-3 mb-3">
                                <div class="input-indicator" id="input2">
                                    <i class="bi bi-circle-fill led-off"></i>
                                    <div class="mt-2">
                                        <strong>DI 2</strong>
                                        <div class="input-state">OFF</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 col-md-3 mb-3">
                                <div class="input-indicator" id="input3">
                                    <i class="bi bi-circle-fill led-off"></i>
                                    <div class="mt-2">
                                        <strong>DI 3</strong>
                                        <div class="input-state">OFF</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 디지털 출력 섹션 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0">
                            <i class="bi bi-upload"></i> 디지털 출력 (DO)
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-6 col-md-3 mb-3">
                                <div class="output-control">
                                    <button class="btn btn-lg btn-outline-secondary output-btn"
                                            id="output0"
                                            data-channel="0"
                                            onclick="toggleOutput(0)">
                                        <i class="bi bi-power"></i>
                                        <div class="mt-2">
                                            <strong>DO 0</strong>
                                            <div class="output-state">OFF</div>
                                        </div>
                                    </button>
                                </div>
                            </div>
                            <div class="col-6 col-md-3 mb-3">
                                <div class="output-control">
                                    <button class="btn btn-lg btn-outline-secondary output-btn"
                                            id="output1"
                                            data-channel="1"
                                            onclick="toggleOutput(1)">
                                        <i class="bi bi-power"></i>
                                        <div class="mt-2">
                                            <strong>DO 1</strong>
                                            <div class="output-state">OFF</div>
                                        </div>
                                    </button>
                                </div>
                            </div>
                            <div class="col-6 col-md-3 mb-3">
                                <div class="output-control">
                                    <button class="btn btn-lg btn-outline-secondary output-btn"
                                            id="output2"
                                            data-channel="2"
                                            onclick="toggleOutput(2)">
                                        <i class="bi bi-power"></i>
                                        <div class="mt-2">
                                            <strong>DO 2</strong>
                                            <div class="output-state">OFF</div>
                                        </div>
                                    </button>
                                </div>
                            </div>
                            <div class="col-6 col-md-3 mb-3">
                                <div class="output-control">
                                    <button class="btn btn-lg btn-outline-secondary output-btn"
                                            id="output3"
                                            data-channel="3"
                                            onclick="toggleOutput(3)">
                                        <i class="bi bi-power"></i>
                                        <div class="mt-2">
                                            <strong>DO 3</strong>
                                            <div class="output-state">OFF</div>
                                        </div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 시스템 로그 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-journal-text"></i> 시스템 로그
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="systemLog" class="system-log"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center py-3 mt-5">
        <div class="container">
            <small class="text-muted">
                CIE-H14A Modbus TCP/IP 제어 시스템 v1.0 |
                <i class="bi bi-github"></i> Made with Flask & Bootstrap
            </small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
